name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Restore and build
        shell: pwsh
        run: msbuild WordGeminiFormula.sln /t:Restore,Build /p:Configuration=Release /p:Platform="Any CPU"
      - name: Math conversion regression smoke test
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $dll = (Resolve-Path 'src/WordGeminiFormula.AddIn/bin/Release/net48/WordGeminiFormula.AddIn.dll').Path
          Add-Type -Path $dll
          $converter = New-Object WordGeminiFormula.AddIn.Word.LatexToUnicodeMathConverter
          $realSet = [string][char]0x211D
          $cases = @(
            @{ Input = '\mathbbR'; MustContain = $realSet; Name = 'real-number set repair' },
            @{ Input = '\frac{x^2+1}{x-1}'; MustContain = '/'; Name = 'fraction conversion' }
          )
          foreach ($case in $cases) {
            $actual = $converter.Convert($case.Input)
            if ([string]::IsNullOrWhiteSpace($actual) -or -not $actual.Contains($case.MustContain)) {
              throw "Math smoke failed: $($case.Name). Input=$($case.Input) Output=$actual"
            }
            Write-Host "PASS $($case.Name): $actual"
          }
      - name: Word math canonicalizer regression smoke test
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $dll = (Resolve-Path 'src/WordGeminiFormula.AddIn/bin/Release/net48/WordGeminiFormula.AddIn.dll').Path
          Add-Type -Path $dll
          $c = New-Object WordGeminiFormula.AddIn.Word.WordMathCanonicalizer
          $realSet = [string][char]0x211D
          $integralSymbol = [string][char]0x222B
          $vectorAccent = [string][char]0x20D7

          $integral = $c.NormalizeForWord('\int f(x) \mathrm{d}x = \sin x + C')
          if (-not $integral.Contains($integralSymbol) -or -not $integral.Contains('sin') -or $integral.Contains('\int') -or $integral.Contains('\mathrm')) {
            throw "Integral canonicalization failed: $integral"
          }
          $log = $c.NormalizeForWord('\log_3(x-1)=1')
          if ($log -ne 'log_3 (x-1)=1') { throw "C4 log-base separator regression: $log" }
          $vector = $c.NormalizeForWord('\overrightarrow{AB}')
          if (-not $vector.Contains($vectorAccent) -or $vector.Contains('\vec')) { throw "Vector canonicalization failed: $vector" }
          $system = $c.NormalizeForWord('\begin{cases}x+y-3<0\\x-y+1>0\end{cases}')
          if (-not $system.StartsWith('\case(') -or -not $system.Contains('@') -or $system.Contains('\begin') -or $system.Contains('■')) {
            throw "C8 legacy cases fallback regression: $system"
          }
          $indexedFunction = $c.NormalizeForWord('f_2(x)=3x^2')
          if (-not $indexedFunction.StartsWith('f_2 (x)')) { throw "C9 indexed-function separator regression: $indexedFunction" }
          $set = $c.NormalizeForWord('\mathbb{R}')
          if (-not $set.Contains($realSet)) { throw "Set canonicalization failed: $set" }
          Write-Host 'PASS legacy Word-linear fallback canonicalization.' -ForegroundColor Green
      - name: MathML V5 structure regression guard
        shell: pwsh
        run: |
          $models = Get-Content 'src/WordGeminiFormula.AddIn/Models/OcrModels.cs' -Raw
          $gemini = Get-Content 'src/WordGeminiFormula.AddIn/Gemini/GeminiClient.cs' -Raw
          $v5 = Get-Content 'src/WordGeminiFormula.AddIn/Word/WordDocumentServiceV5.cs' -Raw
          $connect = Get-Content 'src/WordGeminiFormula.AddIn/Connect.cs' -Raw

          if ($models -notmatch 'string\s+mathml') { throw 'OCR model is missing MathML payloads.' }
          if ($gemini -notmatch 'Presentation MathML 3' -or $gemini -notmatch '<mn>0,5</mn>' -or $gemini -notmatch '<mtable>') {
            throw 'Gemini prompt no longer enforces structure-preserving MathML for decimal commas/cases.'
          }
          if ($connect -notmatch 'new\s+WordDocumentServiceV5\(') { throw 'Connect is not routed through V5.' }
          if ($v5 -notmatch 'MML2OMML\.XSL' -or $v5 -notmatch 'InsertXML' -or $v5 -notmatch 'TryNormalizeMathMl') {
            throw 'V5 MathML -> OMML import path is incomplete.'
          }
          if ($v5 -notmatch 'SessionPayloads' -or $v5 -notmatch 'Document\.Variables|document\.Variables') {
            throw 'V5 pending MathML payload persistence is missing.'
          }
          Write-Host 'PASS MathML-first V5 guards cover Q6 decimal comma and Q8 cases structure.' -ForegroundColor Green
      - name: Word range safety regression guard
        shell: pwsh
        run: |
          $path = 'src/WordGeminiFormula.AddIn/Word/WordDocumentService.cs'
          $source = Get-Content $path -Raw
          if ($source -match '(?m)^\s*string\s+\w+\s*=\s*\(string\)document\.Content\.Text\s*;' -or
              $source -match '(?m)^\s*int\s+\w+\s*=\s*match\.Index\s*;') {
            throw 'Unsafe flattened-text Word Range normalization has returned.'
          }
          Write-Host 'PASS legacy service has no flattened-text offset normalization.' -ForegroundColor Green
      - name: Bookmark and V4 layout regression guard
        shell: pwsh
        run: |
          $safe = Get-Content 'src/WordGeminiFormula.AddIn/Word/WordDocumentServiceV3.cs' -Raw
          $v4 = Get-Content 'src/WordGeminiFormula.AddIn/Word/WordDocumentServiceV4.cs' -Raw
          if ($safe -match 'ContentControls\.Add|WdContentControlRichText') { throw 'V3 bookmark renderer must not create Content Controls.' }
          if ($safe -notmatch 'Bookmarks\.Add' -or $safe -notmatch 'PendingMathBookmarkPrefix' -or $safe -notmatch 'OrderByDescending') {
            throw 'Non-locking bookmark math tracking safeguards are missing.'
          }
          if ($v4 -notmatch 'SplitAtFirstNewline' -or $v4 -notmatch 'SetPrimaryFooter' -or $v4 -notmatch 'ApplyCompactExamLayout') {
            throw 'V4 visual anchoring / footer / compact exam safeguards are missing.'
          }
          Write-Host 'PASS V3/V4 layout and bookmark safety remain intact under V5.' -ForegroundColor Green
      - name: Deferred Word math render regression guard
        shell: pwsh
        run: |
          $path = 'src/WordGeminiFormula.AddIn/Connect.cs'
          $source = Get-Content $path -Raw
          if ($source -notmatch 'word\.InsertOcrBlocks\([\s\S]*?document,\s*false,') {
            throw 'OCR renderer must receive autoNormalize=false so it never inserts Office Math while still typing the document.'
          }
          if ($source -notmatch 'if\s*\(settings\.autoNormalizeAfterOcr\)[\s\S]*?word\.NormalizeAllMarkedFormulas\(\)') {
            throw 'Deferred post-render math normalization pass is missing.'
          }
          Write-Host 'PASS OCR rendering and MathML/OMML normalization remain separate passes.' -ForegroundColor Green
      - name: Installer COM and Office interface smoke test
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $dll = (Resolve-Path 'src/WordGeminiFormula.AddIn/bin/Release/net48/WordGeminiFormula.AddIn.dll').Path
          & .\scripts\install.ps1 -DllPath $dll
          try {
            $type = [Type]::GetTypeFromProgID('WordGeminiFormula.AddIn', $true)
            $addin = [Activator]::CreateInstance($type)
            if ($null -eq $addin) { throw 'COM activation returned null.' }

            $unknown = [Runtime.InteropServices.Marshal]::GetIUnknownForObject($addin)
            try {
              foreach ($iidText in @(
                'B65AD801-ABAF-11D0-BB8B-00A0C90F2744',
                '000C0396-0000-0000-C000-000000000046'
              )) {
                $iid = [Guid]$iidText
                $interfacePtr = [IntPtr]::Zero
                $hr = [Runtime.InteropServices.Marshal]::QueryInterface($unknown, [ref]$iid, [ref]$interfacePtr)
                if ($hr -ne 0 -or $interfacePtr -eq [IntPtr]::Zero) {
                  throw "QueryInterface failed for $iidText with HRESULT 0x$('{0:X8}' -f ($hr -band 0xffffffffL))"
                }
                [void][Runtime.InteropServices.Marshal]::Release($interfacePtr)
              }
            }
            finally {
              [void][Runtime.InteropServices.Marshal]::Release($unknown)
            }

            $xml = $addin.GetCustomUI('Microsoft.Word.Document')
            if ([string]::IsNullOrWhiteSpace($xml) -or $xml -notmatch '<customUI') { throw 'GetCustomUI did not return Ribbon XML.' }
            Write-Host 'COM activation, Office IIDs and Ribbon XML smoke test passed.' -ForegroundColor Green
          }
          finally {
            if ($null -ne $addin -and [Runtime.InteropServices.Marshal]::IsComObject($addin)) {
              [void][Runtime.InteropServices.Marshal]::FinalReleaseComObject($addin)
            }
            & .\scripts\uninstall.ps1 -DllPath $dll
          }
      - name: Stage package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist/WordGeminiFormula -Force | Out-Null
          Copy-Item src/WordGeminiFormula.AddIn/bin/Release/net48/WordGeminiFormula.AddIn.dll dist/WordGeminiFormula/
          Copy-Item scripts/install.ps1 dist/WordGeminiFormula/
          Copy-Item scripts/uninstall.ps1 dist/WordGeminiFormula/
          Copy-Item README.md dist/WordGeminiFormula/
      - uses: actions/upload-artifact@v4
        with:
          name: WordGeminiFormula
          path: dist/WordGeminiFormula
