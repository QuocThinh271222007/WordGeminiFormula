name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Restore and build
        shell: pwsh
        run: msbuild WordGeminiFormula.sln /t:Restore,Build /p:Configuration=Release /p:Platform="Any CPU"
      - name: Math conversion regression smoke test
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $dll = (Resolve-Path 'src/WordGeminiFormula.AddIn/bin/Release/net48/WordGeminiFormula.AddIn.dll').Path
          Add-Type -Path $dll
          $converter = New-Object WordGeminiFormula.AddIn.Word.LatexToUnicodeMathConverter
          $realSet = [string][char]0x211D
          $cases = @(
            @{ Input = '\mathbbR'; MustContain = $realSet; Name = 'real-number set repair' },
            @{ Input = '\overrightarrowAB'; MustContain = '\vec'; Name = 'vector repair' },
            @{ Input = '\frac{x^2+1}{x-1}'; MustContain = '/'; Name = 'fraction conversion' },
            @{ Input = '\begin{cases}x+y<3\\x-y+1>0\end{cases}'; MustContain = '\matrix'; Name = 'cases conversion' }
          )
          foreach ($case in $cases) {
            $actual = $converter.Convert($case.Input)
            if ([string]::IsNullOrWhiteSpace($actual) -or -not $actual.Contains($case.MustContain)) {
              throw "Math smoke failed: $($case.Name). Input=$($case.Input) Output=$actual"
            }
            Write-Host "PASS $($case.Name): $actual"
          }
      - name: Word range safety regression guard
        shell: pwsh
        run: |
          $path = 'src/WordGeminiFormula.AddIn/Word/WordDocumentService.cs'
          $source = Get-Content $path -Raw
          if ($source -match '(?m)^\s*string\s+\w+\s*=\s*\(string\)document\.Content\.Text\s*;' -or
              $source -match '(?m)^\s*int\s+\w+\s*=\s*match\.Index\s*;') {
            throw 'Unsafe flattened-text Word Range normalization has returned.'
          }
          Write-Host 'PASS legacy service has no flattened-text offset normalization.' -ForegroundColor Green
      - name: Bookmark renderer regression guard
        shell: pwsh
        run: |
          $connect = Get-Content 'src/WordGeminiFormula.AddIn/Connect.cs' -Raw
          $safe = Get-Content 'src/WordGeminiFormula.AddIn/Word/WordDocumentServiceV3.cs' -Raw
          if ($connect -notmatch 'new\s+WordDocumentServiceV3\(') {
            throw 'Connect is not routed through WordDocumentServiceV3.'
          }
          if ($safe -match 'ContentControls\.Add|WdContentControlRichText') {
            throw 'V3 renderer must not create Content Controls; they create limited editing zones.'
          }
          if ($safe -notmatch 'Bookmarks\.Add' -or $safe -notmatch 'PendingMathBookmarkPrefix' -or $safe -notmatch 'OrderByDescending') {
            throw 'Non-locking bookmark math tracking safeguards are missing.'
          }
          Write-Host 'PASS active OCR renderer tracks pending math with non-locking Word bookmarks.' -ForegroundColor Green
      - name: Deferred Word math render regression guard
        shell: pwsh
        run: |
          $path = 'src/WordGeminiFormula.AddIn/Connect.cs'
          $source = Get-Content $path -Raw
          if ($source -notmatch 'word\.InsertOcrBlocks\([\s\S]*?document,\s*false,') {
            throw 'OCR renderer must receive autoNormalize=false so it never builds OMath while still typing the document.'
          }
          if ($source -notmatch 'if\s*\(settings\.autoNormalizeAfterOcr\)[\s\S]*?word\.NormalizeAllMarkedFormulas\(\)') {
            throw 'Deferred post-render math normalization pass is missing.'
          }
          Write-Host 'PASS OCR rendering and OMath normalization are separated into two passes.' -ForegroundColor Green
      - name: Installer COM and Office interface smoke test
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $dll = (Resolve-Path 'src/WordGeminiFormula.AddIn/bin/Release/net48/WordGeminiFormula.AddIn.dll').Path
          & .\scripts\install.ps1 -DllPath $dll
          try {
            $type = [Type]::GetTypeFromProgID('WordGeminiFormula.AddIn', $true)
            $addin = [Activator]::CreateInstance($type)
            if ($null -eq $addin) { throw 'COM activation returned null.' }

            $unknown = [Runtime.InteropServices.Marshal]::GetIUnknownForObject($addin)
            try {
              foreach ($iidText in @(
                'B65AD801-ABAF-11D0-BB8B-00A0C90F2744',
                '000C0396-0000-0000-C000-000000000046'
              )) {
                $iid = [Guid]$iidText
                $interfacePtr = [IntPtr]::Zero
                $hr = [Runtime.InteropServices.Marshal]::QueryInterface($unknown, [ref]$iid, [ref]$interfacePtr)
                if ($hr -ne 0 -or $interfacePtr -eq [IntPtr]::Zero) {
                  throw "QueryInterface failed for $iidText with HRESULT 0x$('{0:X8}' -f ($hr -band 0xffffffffL))"
                }
                [void][Runtime.InteropServices.Marshal]::Release($interfacePtr)
              }
            }
            finally {
              [void][Runtime.InteropServices.Marshal]::Release($unknown)
            }

            $xml = $addin.GetCustomUI('Microsoft.Word.Document')
            if ([string]::IsNullOrWhiteSpace($xml) -or $xml -notmatch '<customUI') {
              throw 'GetCustomUI did not return Ribbon XML.'
            }

            Write-Host 'COM activation, IDTExtensibility2 IID, IRibbonExtensibility IID, and Ribbon XML smoke test passed.' -ForegroundColor Green
          }
          finally {
            if ($null -ne $addin -and [Runtime.InteropServices.Marshal]::IsComObject($addin)) {
              [void][Runtime.InteropServices.Marshal]::FinalReleaseComObject($addin)
            }
            & .\scripts\uninstall.ps1 -DllPath $dll
          }
      - name: Stage package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist/WordGeminiFormula -Force | Out-Null
          Copy-Item src/WordGeminiFormula.AddIn/bin/Release/net48/WordGeminiFormula.AddIn.dll dist/WordGeminiFormula/
          Copy-Item scripts/install.ps1 dist/WordGeminiFormula/
          Copy-Item scripts/uninstall.ps1 dist/WordGeminiFormula/
          Copy-Item README.md dist/WordGeminiFormula/
      - uses: actions/upload-artifact@v4
        with:
          name: WordGeminiFormula
          path: dist/WordGeminiFormula
